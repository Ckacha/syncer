{% extends "base.html" %}
{% from "_rules.html" import rule_fields %}
{% block title %}Edit automation · Syncer{% endblock %}
{% block content %}
  <a class="back" href="/automations">&larr; Back</a>
  <h1>{{ a.source_title }}</h1>

  <form method="post" class="card" style="margin-top:16px">
    {{ rule_fields(a, picks, max_songs) }}
    <div class="field">
      <label for="dest">Playlist name</label>
      <input id="dest" name="dest_name" value="{{ a.dest_name }}">
    </div>
    <div class="actions" style="margin-top:18px"><button>Save</button></div>
  </form>
{% endblock %}
