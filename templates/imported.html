<!doctype html>
<html>
  <head>
    <meta charset="utf-8"><title>Imported</title>
  </head>

  <body>
    <h1>Created "{{ name }}"</h1>
    <p>Added {{ added }} of {{ total }} songs.</p>
    {% if added < total %}
      <p style="background:#fff3cd;padding:8px">
        YouTube's daily quota ran out partway. The playlist has the first {{ added }} songs,
        add the rest by hand or import again after midnight Pacific time.
      </p>
    {% endif %}
    <p><a href="{{ url }}">Open it in {{ d.dest }}</a></p>
    <p><a href="{{ back }}">&larr; Back to the review</a></p>
  </body>
</html>
